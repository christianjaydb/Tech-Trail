<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f8">
<title>TechTrail — Computer Systems Basics</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23eef1f5'/%3E%3Crect x='9' y='9' width='14' height='14' rx='2' fill='none' stroke='%231f6fb3' stroke-width='1.6'/%3E%3Crect x='13' y='13' width='6' height='6' rx='1' fill='%23e0912f'/%3E%3Cline x1='13' y1='9' x2='13' y2='6' stroke='%231f6fb3' stroke-width='1.6' stroke-linecap='round'/%3E%3Cline x1='19' y1='9' x2='19' y2='6' stroke='%231f6fb3' stroke-width='1.6' stroke-linecap='round'/%3E%3Cline x1='13' y1='23' x2='13' y2='26' stroke='%231f6fb3' stroke-width='1.6' stroke-linecap='round'/%3E%3Cline x1='19' y1='23' x2='19' y2='26' stroke='%231f6fb3' stroke-width='1.6' stroke-linecap='round'/%3E%3Cline x1='9' y1='13' x2='6' y2='13' stroke='%231f6fb3' stroke-width='1.6' stroke-linecap='round'/%3E%3Cline x1='9' y1='19' x2='6' y2='19' stroke='%231f6fb3' stroke-width='1.6' stroke-linecap='round'/%3E%3Cline x1='23' y1='13' x2='26' y2='13' stroke='%231f6fb3' stroke-width='1.6' stroke-linecap='round'/%3E%3Cline x1='23' y1='19' x2='26' y2='19' stroke='%231f6fb3' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Tokens — cool tech palette, blue / amber complements ===== */
:root{
  --bg:#f4f5f8;
  --bg-soft:#eceef2;
  --panel:rgba(255,255,255,0.72);
  --panel-alt:rgba(255,255,255,0.94);
  --border:#dfe2e8;
  --border-bright:#c2c8d3;
  --text:#22262e;
  --text-dim:#5a6270;
  --text-faint:#8b93a3;
  --accent:#3d8fd6;       /* tech blue */
  --accent-hi:#1f6fb3;
  --accent-dim:#e3eef8;
  --gold:#e0912f;         /* amber — complementary secondary accent */
  --gold-dim:#faecd9;
  --danger:#d1483c;
  --danger-dim:#fbe2df;
  --radius:16px;
  --radius-sm:12px;
  --font-display:'Space Grotesk','Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(ellipse 900px 500px at 12% -10%, rgba(61,143,214,0.09) 0%, transparent 60%),
    radial-gradient(ellipse 700px 500px at 92% 100%, rgba(224,145,47,0.07) 0%, transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

#app{
  max-width:900px;
  margin:0 auto;
  padding:28px 20px 60px;
  position:relative;
}

button{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:0.001s!important;transition-duration:0.001s!important;}
}

/* ===== Brand bar ===== */
.brand-bar{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;
  padding:4px 2px 22px;
  border-bottom:1px solid var(--border);
  margin-bottom:30px;
  position:relative;
}
.brand{
  display:flex;align-items:center;gap:12px;
}
.brand-mark{
  width:42px;height:42px;
  border-radius:12px;
  background:var(--panel-alt);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow:0 4px 14px -6px rgba(34,38,46,0.14);
}
.brand-mark svg{display:block;width:23px;height:23px;}
.brand-word{
  font-family:var(--font-display);
  font-weight:700;
  font-size:20px;
  letter-spacing:.01em;
  color:var(--text);
  line-height:1;
}
.brand-word em{
  font-style:normal;
  color:var(--accent-hi);
}
.brand-sub{
  font-family:var(--font-body);
  font-size:12px;
  color:var(--text-faint);
  letter-spacing:.02em;
  padding-left:54px;
  margin-top:2px;
  width:100%;
}
.brand-tag{
  font-family:var(--font-body);
  font-size:12px;
  color:var(--accent-hi);
  letter-spacing:.02em;
  opacity:.9;
}

/* ===== Screens ===== */
.screen{animation:fadein .35s ease both;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ===== Home ===== */
.hero{padding:8px 2px 34px;}
.hero h1{
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(26px,5vw,38px);
  line-height:1.25;
  margin:0 0 14px;
  color:var(--text);
  letter-spacing:0;
}
.hero h1 span{
  color:var(--accent-hi);
  font-style:normal;
}
.hero p{
  color:var(--text-dim);
  font-size:15.5px;
  line-height:1.7;
  max-width:58ch;
  margin:0 0 20px;
}
.hero-stats{
  display:flex;gap:24px;flex-wrap:wrap;
  font-family:var(--font-body);
  font-size:13px;
  color:var(--text-dim);
}
.hero-stats b{color:var(--accent-hi);font-weight:700;}

.section-label{
  font-family:var(--font-body);
  font-size:12.5px;
  letter-spacing:.04em;
  color:var(--accent-hi);
  font-weight:700;
  margin:0 0 16px;
  padding-left:2px;
  display:flex;align-items:center;gap:9px;
}
.section-label::before{
  content:'✻';
  color:var(--gold);
}
.section-label::after{
  content:'';
  flex:1;
  height:1px;
  background:linear-gradient(90deg, var(--border-bright), transparent);
}

.mode-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:16px;
  margin-bottom:34px;
}
.mode-card{
  background:var(--panel);
  backdrop-filter:blur(8px);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px 20px 18px;
  text-align:left;
  cursor:pointer;
  color:var(--text);
  transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease, background .18s ease;
  display:flex;flex-direction:column;gap:8px;
  position:relative;
  overflow:hidden;
}
.mode-card:hover,.mode-card:focus-visible{
  border-color:var(--accent);
  background:var(--panel-alt);
  transform:translateY(-2px);
  box-shadow:0 12px 26px -18px rgba(34,38,46,0.22);
}
.mode-card .mode-name{
  font-family:var(--font-display);
  font-size:17px;
  font-weight:700;
  letter-spacing:0;
}
.mode-card .mode-meta{
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--gold);
  font-weight:600;
  letter-spacing:.03em;
}
.mode-card .mode-desc{
  font-size:13.5px;
  color:var(--text-dim);
  line-height:1.55;
  margin:0;
}

/* ===== Panel / config ===== */
.panel{
  background:var(--panel);
  backdrop-filter:blur(8px);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:26px;
  box-shadow:0 16px 34px -28px rgba(34,38,46,0.24);
}
.panel h2{
  font-family:var(--font-display);
  font-weight:700;
  font-size:20px;
  margin:0 0 6px;
  letter-spacing:0;
}
.panel .panel-sub{color:var(--text-dim);font-size:13.5px;margin:0 0 20px;}

.choice-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
.pill-btn{
  background:var(--panel-alt);
  border:1px solid var(--border);
  color:var(--text);
  padding:11px 18px;
  border-radius:999px;
  font-family:var(--font-body);
  font-size:13.5px;
  cursor:pointer;
  transition:border-color .15s ease, background .15s ease, color .15s ease, box-shadow .15s ease;
  min-height:40px;
}
.pill-btn:hover{border-color:var(--border-bright);}
.pill-btn.active{
  background:var(--accent-dim);
  border-color:var(--accent);
  color:var(--accent-hi);
  font-weight:700;
}

.primary-btn{
  background:var(--accent-hi);
  color:#f5f8fc;
  border:none;
  padding:13px 24px;
  border-radius:999px;
  font-family:var(--font-display);
  font-weight:700;
  font-size:14px;
  letter-spacing:.01em;
  cursor:pointer;
  transition:filter .15s ease, transform .15s ease, box-shadow .15s ease;
  box-shadow:0 8px 20px -8px rgba(31,111,179,0.5);
  min-height:46px;
}
.primary-btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 10px 24px -6px rgba(31,111,179,0.55);}
.primary-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}

.ghost-btn{
  background:transparent;
  color:var(--text-dim);
  border:1px solid var(--border);
  padding:12px 20px;
  border-radius:999px;
  font-family:var(--font-body);
  font-size:13.5px;
  cursor:pointer;
  transition:border-color .15s ease,color .15s ease,background .15s ease;
  min-height:46px;
}
.ghost-btn:hover{border-color:var(--accent);color:var(--accent-hi);background:var(--accent-dim);}

.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;}

/* ===== Modal (custom confirm — avoids blocked native dialogs) ===== */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(20,23,28,0.45);
  backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  z-index:100;
  animation:fadein .15s ease both;
}
.modal-box{
  background:var(--panel-alt);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:24px;
  max-width:380px;
  width:100%;
  box-shadow:0 24px 48px -20px rgba(20,23,28,0.35);
}
.modal-title{
  font-family:var(--font-display);
  font-weight:700;
  font-size:18px;
  margin:0 0 10px;
  color:var(--text);
}
.modal-body{
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.6;
  color:var(--text-dim);
  margin:0 0 20px;
}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
.modal-actions .ghost-btn,.modal-actions .primary-btn{min-height:42px;padding:10px 18px;}
.primary-btn.danger{
  background:var(--danger);
  box-shadow:0 8px 20px -8px rgba(209,72,60,0.55);
}
.primary-btn.danger:hover{filter:brightness(1.06);}

/* ===== Quiz topbar / End Quiz control ===== */
.quiz-topbar{
  display:flex;
  justify-content:flex-end;
  margin-bottom:10px;
}
.end-btn{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text-faint);
  padding:8px 14px;
  border-radius:999px;
  font-family:var(--font-mono);
  font-size:12px;
  font-weight:600;
  letter-spacing:.02em;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  transition:border-color .15s ease,color .15s ease,background .15s ease;
  min-height:34px;
}
.end-btn:hover,.end-btn:focus-visible{
  border-color:var(--danger);
  color:var(--danger);
  background:var(--danger-dim);
}

/* ===== Telemetry bar (now a calm stat strip) ===== */
.telemetry{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-bottom:18px;
  font-family:var(--font-body);
}
.telemetry .cell{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:11px 13px;
  min-width:0;
}
.telemetry .cell .k{
  font-size:10.5px;
  letter-spacing:.03em;
  color:var(--text-faint);
  margin-bottom:4px;
}
.telemetry .cell .v{
  font-size:15px;
  font-weight:600;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-family:var(--font-mono);
  letter-spacing:-0.01em;
}
.telemetry .cell .v.accent{color:var(--accent-hi);}
.telemetry .cell .v.amber{color:var(--gold);}
.telemetry .cell .v.diff-easy{color:#5c9968;}
.telemetry .cell .v.diff-medium{color:var(--gold);}
.telemetry .cell .v.diff-hard{color:var(--danger);}

.progress-track{
  height:8px;
  background:var(--border);
  border-radius:8px;
  overflow:hidden;
  margin-bottom:22px;
}
.progress-fill{
  height:100%;
  background:var(--accent);
  border-radius:8px;
  transition:width .3s ease;
}

/* ===== Question card ===== */
.q-card{
  background:var(--panel);
  backdrop-filter:blur(8px);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:26px 24px;
  box-shadow:0 16px 34px -28px rgba(34,38,46,0.24);
}
.q-meta{
  display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  margin-bottom:16px;
  font-family:var(--font-body);
  font-size:11.5px;
  letter-spacing:.02em;
}
.q-tag{
  padding:4px 10px;
  border-radius:999px;
  border:1px solid var(--border-bright);
  color:var(--text-dim);
  font-weight:600;
}
.q-tag.diff-easy{color:#4d8858;border-color:#c7dfc8;background:#eef6ee;}
.q-tag.diff-medium{color:var(--gold);border-color:var(--gold-dim);background:#fbf1e5;}
.q-tag.diff-hard{color:var(--danger);border-color:var(--danger-dim);background:#faeae7;}

.q-text{
  font-family:var(--font-body);
  font-weight:600;
  font-size:18.5px;
  line-height:1.55;
  margin:0 0 22px;
  color:var(--text);
}

.choices{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;}
.choice-btn{
  text-align:left;
  background:var(--panel-alt);
  border:1px solid var(--border);
  color:var(--text);
  padding:14px 16px;
  border-radius:var(--radius-sm);
  font-size:14.5px;
  cursor:pointer;
  display:flex;align-items:center;gap:12px;
  transition:border-color .12s ease, background .12s ease, box-shadow .12s ease, transform .12s ease;
  min-height:48px;
}
.choice-btn:hover:not(:disabled){border-color:var(--accent);background:var(--accent-dim);transform:translateY(-1px);}
.choice-btn:disabled{cursor:default;}
.choice-btn .letter{
  font-family:var(--font-body);
  font-weight:700;
  font-size:12px;
  color:var(--text-faint);
  border:1px solid var(--border);
  border-radius:8px;
  width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.choice-btn.selected{border-color:var(--accent);background:var(--accent-dim);}
.choice-btn.correct{
  border-color:var(--accent);
  background:var(--accent-dim);
}
.choice-btn.correct .letter{background:var(--accent-hi);color:#f5f8fc;border-color:var(--accent-hi);}
.choice-btn.incorrect{
  border-color:var(--danger);
  background:var(--danger-dim);
}
.choice-btn.incorrect .letter{background:var(--danger);color:#fdf3f2;border-color:var(--danger);}

.feedback{
  margin-top:18px;
  padding:15px 17px;
  border-radius:var(--radius-sm);
  font-family:var(--font-body);
  font-size:13.5px;
  line-height:1.6;
  border:1px solid var(--border);
}
.feedback.ok{border-color:#c7dfc8;background:#eef6ee;}
.feedback.no{border-color:var(--danger-dim);background:#faeae7;}
.feedback .status-line{
  font-weight:700;
  letter-spacing:0;
  margin-bottom:6px;
}
.feedback.ok .status-line{color:var(--accent-hi);}
.feedback.no .status-line{color:var(--danger);}
.feedback .explain{color:var(--text-dim);font-family:var(--font-body);font-size:13.5px;}

.q-footer{display:flex;justify-content:flex-end;margin-top:20px;}

.mistake-note{
  margin-top:14px;
  font-family:var(--font-body);
  font-size:12px;
  color:var(--text-faint);
}

/* ===== Results ===== */
.rating-banner{
  text-align:center;
  padding:34px 20px;
  border-radius:var(--radius);
  border:1px solid var(--border);
  background:var(--panel);
  backdrop-filter:blur(8px);
  margin-bottom:22px;
  position:relative;
  overflow:hidden;
}
.rating-banner::before{
  content:'';
  position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%, rgba(92,144,128,0.10), transparent 65%);
  pointer-events:none;
}
.rating-banner .pct{
  font-family:var(--font-mono);
  font-size:52px;
  font-weight:700;
  color:var(--accent-hi);
  line-height:1;
  position:relative;
}
.rating-banner .label{
  font-family:var(--font-body);
  font-size:13.5px;
  letter-spacing:.02em;
  color:var(--text-dim);
  margin-top:12px;
  position:relative;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
  margin-bottom:26px;
}
.stat-cell{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;}
.stat-cell .k{font-family:var(--font-body);font-size:11px;letter-spacing:.02em;color:var(--text-faint);margin-bottom:6px;}
.stat-cell .v{font-family:var(--font-mono);font-size:19px;font-weight:600;color:var(--accent-hi);}

/* ===== Review ===== */
.review-item{
  background:var(--panel);
  backdrop-filter:blur(8px);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px 20px;
  margin-bottom:12px;
}
.review-item .q{font-family:var(--font-body);font-size:15.5px;font-weight:600;margin:0 0 10px;}
.review-item .row{font-family:var(--font-body);font-size:13px;margin:4px 0;}
.review-item .row .lbl{color:var(--text-faint);margin-right:6px;}
.review-item .row.wrong .val{color:var(--danger);}
.review-item .row.right .val{color:var(--accent-hi);}
.review-item .explain{color:var(--text-dim);font-size:13.5px;margin-top:10px;line-height:1.5;}

.empty-note{
  color:var(--text-dim);
  font-family:var(--font-body);
  font-size:13.5px;
  padding:22px;
  text-align:center;
  border:1px dashed var(--border-bright);
  border-radius:var(--radius);
}

footer.foot{
  text-align:center;
  color:var(--text-faint);
  font-family:var(--font-body);
  font-size:12px;
  letter-spacing:.01em;
  margin-top:44px;
  padding-top:22px;
  border-top:1px solid var(--border);
}

/* ===== Responsive ===== */
@media(max-width:640px){
  #app{padding:20px 16px 48px;}
  .telemetry{grid-template-columns:repeat(2,1fr);}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .rating-banner .pct{font-size:42px;}
  .rating-banner{padding:28px 16px;}
  .q-card,.panel{padding:20px 18px;}
  .q-text{font-size:16.5px;}
  .btn-row{flex-direction:column;}
  .btn-row .primary-btn,.btn-row .ghost-btn{width:100%;}
  .q-footer .primary-btn{width:100%;}
  .modal-actions{flex-direction:column-reverse;}
  .modal-actions .ghost-btn,.modal-actions .primary-btn{width:100%;}
}

@media(max-width:420px){
  .brand-word{font-size:17px;}
  .hero h1{font-size:23px;}
  .mode-card{padding:16px;}
  .choice-row .pill-btn{flex:1 1 calc(50% - 10px);text-align:center;}
}
</style>
</head>
<body>
<div id="app" role="main" aria-live="polite"></div>
<script>
const QUESTION_POOL = [
{
"id":1,
"category":"Fundamentals",
"difficulty":"Easy",
"type":"multiple-choice",
"question":"Which term best matches this definition: \"An electronic device that processes data according to instructions.\"",
"choices":[
"Firmware",
"Hardware",
"Computer",
"Software"
],
"answer":"Computer",
"explanation":"Computer is defined as: An electronic device that processes data according to instructions."
},
{
"id":2,
"category":"Fundamentals",

<script>
/* ============================================================
   Computer Systems Basics Challenge — quiz engine
   QUESTION_POOL is provided by questions_data.js (loaded first)
   ============================================================ */

const root = document.getElementById('app');

/* ---------- Randomization helpers ---------- */

// Fisher-Yates shuffle — returns a NEW array, never mutates input
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Returns a shuffled copy of a question with its choices shuffled too
function shuffleChoices(question) {
  return Object.assign({}, question, { choices: shuffle(question.choices) });
}

// Picks `count` unique questions from the pool and shuffles their choices.
// Never mutates QUESTION_POOL.
function shuffleQuestions(pool, count) {
  const picked = shuffle(pool).slice(0, count);
  return picked.map(shuffleChoices);
}

/* ---------- Mode configuration ---------- */

const MODES = {
  quick:     { name: 'Quick Quiz',    count: 10,  desc: '10 questions. Fast diagnostic pass with immediate feedback.', code: 'QK-10' },
  standard:  { name: 'Standard Quiz', count: 25,  desc: '25 questions across all topics, with a live progress readout.', code: 'STD-25' },
  challenge: { name: 'Challenge Mode',count: 50,  desc: '50 questions, ramping from easy to hard. 5 mistakes and it\'s over.', code: 'CHL-50' },
  practice:  { name: 'Practice Mode', count: null,desc: 'Unlimited, untimed practice with an explanation after every answer.', code: 'PRC-∞' },
  full:      { name: 'Full Review',   count: QUESTION_POOL.length, desc: `The entire ${QUESTION_POOL.length}-question pool, shuffled, no repeats.`, code: `FUL-${QUESTION_POOL.length}` },
};

const MAX_CHALLENGE_MISTAKES = 5;

function pointsFor(difficulty) {
  if (difficulty === 'Easy') return 10;
  if (difficulty === 'Medium') return 20;
  return 30;
}

function ratingFor(pct) {
  if (pct >= 90) return 'Excellent';
  if (pct >= 80) return 'Very Good';
  if (pct >= 70) return 'Good';
  if (pct >= 60) return 'Needs Improvement';
  return 'Keep Practicing';
}

/* ---------- Application state ---------- */

let state = null;

function freshState() {
  return {
    screen: 'home',
    mode: null,
    timerSetting: 0, // 0 = no timer
    questions: [],
    index: 0,
    score: 0,
    streak: 0,
    highestStreak: 0,
    correctCount: 0,
    incorrectCount: 0,
    incorrectLog: [],
    selected: null,
    answered: false,
    timeLeft: 0,
    timerId: null,
    startTime: null,
    endTime: null,
    mistakes: 0,
    practicePool: [],   // shuffled queue for practice mode
    pendingMode: null,  // mode chosen but awaiting timer selection
  };
}

state = freshState();

function stopTimer() {
  if (state.timerId) {
    clearInterval(state.timerId);
    state.timerId = null;
  }
}

function goto(screen) {
  state.screen = screen;
  render();
}

/* ---------- Quiz session setup ---------- */

function buildSession(mode) {
  if (mode === 'challenge') {
    const easy = shuffle(QUESTION_POOL.filter(q => q.difficulty === 'Easy'));
    const medium = shuffle(QUESTION_POOL.filter(q => q.difficulty === 'Medium'));
    const hard = shuffle(QUESTION_POOL.filter(q => q.difficulty === 'Hard'));
    const eCount = Math.min(15, easy.length);
    const mCount = Math.min(20, medium.length);
    const hCount = Math.min(15, hard.length);
    const seq = [...easy.slice(0, eCount), ...medium.slice(0, mCount), ...hard.slice(0, hCount)];
    return seq.map(shuffleChoices);
  }
  if (mode === 'full') {
    return shuffleQuestions(QUESTION_POOL, QUESTION_POOL.length);
  }
  const cfg = MODES[mode];
  return shuffleQuestions(QUESTION_POOL, cfg.count);
}

function startQuiz(mode, timerSetting) {
  stopTimer();
  const fresh = freshState();
  fresh.mode = mode;
  fresh.timerSetting = mode === 'practice' ? 0 : timerSetting;
  fresh.startTime = Date.now();

  if (mode === 'practice') {
    fresh.practicePool = shuffle(QUESTION_POOL);
    fresh.questions = [fresh.practicePool.shift()].map(shuffleChoices);
  } else {
    fresh.questions = buildSession(mode);
  }
  state = fresh;
  goto('quiz');
  armTimer();
}

function nextPracticeQuestion() {
  if (state.practicePool.length === 0) {
    state.practicePool = shuffle(QUESTION_POOL);
  }
  const q = shuffleChoices(state.practicePool.shift());
  state.questions.push(q);
}

/* ---------- Timer ---------- */

function armTimer() {
  stopTimer();
  if (!state.timerSetting) return;
  state.timeLeft = state.timerSetting;
  state.timerId = setInterval(() => {
    state.timeLeft -= 1;
    if (state.timeLeft <= 0) {
      stopTimer();
      if (!state.answered) submitAnswer(null, true);
    } else {
      renderTimerOnly();
    }
  }, 1000);
}

/* ---------- Answering ---------- */

function submitAnswer(choice, timedOut) {
  if (state.answered) return;
  const q = state.questions[state.index];
  stopTimer();
  state.answered = true;
  state.selected = choice;
  const correct = !timedOut && choice === q.answer;

  if (correct) {
    state.correctCount += 1;
    state.streak += 1;
    state.highestStreak = Math.max(state.highestStreak, state.streak);
    let gained = pointsFor(q.difficulty);
    if (state.streak === 3) gained += 10;
    else if (state.streak === 5) gained += 20;
    else if (state.streak === 10) gained += 50;
    state.score += gained;
    state.lastGain = gained;
  } else {
    state.incorrectCount += 1;
    state.streak = 0;
    state.mistakes += 1;
    state.incorrectLog.push({
      question: q.question,
      userAnswer: timedOut ? '(no answer — time expired)' : choice,
      correctAnswer: q.answer,
      explanation: q.explanation,
    });
    state.lastGain = 0;
  }
  render();
}

function advance() {
  const isLast = state.index >= state.questions.length - 1;

  if (state.mode === 'challenge' && state.mistakes >= MAX_CHALLENGE_MISTAKES) {
    finishQuiz();
    return;
  }
  if (state.mode === 'practice') {
    state.index += 1;
    nextPracticeQuestion();
    state.answered = false;
    state.selected = null;
    render();
    armTimer();
    return;
  }
  if (isLast) {
    finishQuiz();
    return;
  }
  state.index += 1;
  state.answered = false;
  state.selected = null;
  render();
  armTimer();
}

// Lets the player end the run early from mid-quiz. Whatever has been
// answered so far still counts — results are computed from the same
// score/correctCount/incorrectCount tallies as a normal finish.
// Uses a custom modal instead of window.confirm(), since native browser
// dialogs are blocked in sandboxed/embedded previews and would otherwise
// make the button appear to do nothing.
function confirmEndQuiz() {
  const answered = state.correctCount + state.incorrectCount;
  const msg = answered > 0
    ? `You've answered ${answered} question${answered === 1 ? '' : 's'} so far. Your results will be based on those.`
    : 'No questions have been answered yet — your results will be empty.';
  showModal({
    title: 'End quiz now?',
    body: msg,
    confirmLabel: 'End Quiz',
    cancelLabel: 'Keep Playing',
    onConfirm: finishQuiz,
  });
}

function showModal({ title, body, confirmLabel, cancelLabel, onConfirm }) {
  const overlay = el('div', { class: 'modal-overlay', role: 'presentation' });
  const close = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });

  const box = el('div', { class: 'modal-box', role: 'alertdialog', 'aria-modal': 'true', 'aria-label': title }, [
    el('h3', { class: 'modal-title' }, title),
    el('p', { class: 'modal-body' }, body),
    el('div', { class: 'modal-actions' }, [
      el('button', { class: 'ghost-btn', onclick: close }, cancelLabel),
      el('button', {
        class: 'primary-btn danger',
        onclick: () => { close(); onConfirm(); },
      }, confirmLabel),
    ]),
  ]);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  box.querySelector('.primary-btn')?.focus();
}

function finishQuiz() {
  stopTimer();
  state.endTime = Date.now();
  goto('results');
}

/* ---------- Rendering ---------- */

function render() {
  root.innerHTML = '';
  root.appendChild(renderBrandBar());

  let body;
  switch (state.screen) {
    case 'home': body = renderHome(); break;
    case 'timer-select': body = renderTimerSelect(); break;
    case 'quiz': body = renderQuiz(); break;
    case 'results': body = renderResults(); break;
    case 'review': body = renderReview(); break;
    default: body = renderHome();
  }
  root.appendChild(body);

  const foot = document.createElement('footer');
  foot.className = 'foot';
  foot.textContent = `TECHTRAIL // ${QUESTION_POOL.length} QUESTIONS ACROSS ${new Set(QUESTION_POOL.map(q=>q.category)).size} WAYPOINTS`;
  root.appendChild(foot);
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue; // skip falsy attrs (e.g. disabled: null)
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (v === true) node.setAttribute(k, '');
    else node.setAttribute(k, v);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}

const TRAIL_MARK_SVG = `
<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <rect x="9" y="9" width="14" height="14" rx="2" stroke="#1f6fb3" stroke-width="1.6"/>
  <rect x="13" y="13" width="6" height="6" rx="1" fill="#e0912f"/>
  <line x1="13" y1="9" x2="13" y2="6" stroke="#1f6fb3" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="19" y1="9" x2="19" y2="6" stroke="#1f6fb3" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="13" y1="23" x2="13" y2="26" stroke="#1f6fb3" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="19" y1="23" x2="19" y2="26" stroke="#1f6fb3" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="9" y1="13" x2="6" y2="13" stroke="#1f6fb3" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="9" y1="19" x2="6" y2="19" stroke="#1f6fb3" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="23" y1="13" x2="26" y2="13" stroke="#1f6fb3" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="23" y1="19" x2="26" y2="19" stroke="#1f6fb3" stroke-width="1.6" stroke-linecap="round"/>
</svg>`;

function renderBrandBar() {
  return el('div', { class: 'brand-bar' }, [
    el('div', { class: 'brand' }, [
      (() => {
        const mark = el('div', { class: 'brand-mark', 'aria-hidden': 'true' });
        mark.innerHTML = TRAIL_MARK_SVG;
        return mark;
      })(),
      el('div', { class: 'brand-word' }, ['Tech', el('em', {}, 'Trail')]),
    ]),
    el('div', { class: 'brand-tag' }, 'CS BASICS TRAINING ROUTE'),
    el('div', { class: 'brand-sub' }, `${QUESTION_POOL.length}-QUESTION POOL // ${new Set(QUESTION_POOL.map(q => q.category)).size} WAYPOINTS`),
  ]);
}

/* ---- Home ---- */

function renderHome() {
  const wrap = el('div', { class: 'screen' });
  wrap.appendChild(el('div', { class: 'hero' }, [
    el('h1', {}, ['Chart your route through ', el('span', {}, 'computer systems')]),
    el('p', {}, `A self-guided trail through hardware, operating systems, networking, and cybersecurity fundamentals. Every attempt reshuffles a fresh path from a pool of ${QUESTION_POOL.length} questions — no two runs look the same.`),
    el('div', { class: 'hero-stats' }, [
      el('span', {}, [el('b', {}, String(QUESTION_POOL.length)), ' questions']),
      el('span', {}, [el('b', {}, String(new Set(QUESTION_POOL.map(q => q.category)).size)), ' waypoints']),
      el('span', {}, [el('b', {}, '5'), ' routes']),
    ]),
  ]));

  wrap.appendChild(el('div', { class: 'section-label' }, 'Choose your route'));

  const grid = el('div', { class: 'mode-grid' });
  Object.entries(MODES).forEach(([key, cfg]) => {
    const card = el('button', {
      class: 'mode-card',
      onclick: () => {
        state.pendingMode = key;
        if (key === 'practice') {
          startQuiz('practice', 0);
        } else {
          goto('timer-select');
        }
      },
    }, [
      el('div', { class: 'mode-meta' }, cfg.code),
      el('div', { class: 'mode-name' }, cfg.name),
      el('p', { class: 'mode-desc' }, cfg.desc),
    ]);
    grid.appendChild(card);
  });
  wrap.appendChild(grid);

  return wrap;
}

/* ---- Timer select ---- */

function renderTimerSelect() {
  const mode = state.pendingMode;
  const cfg = MODES[mode];
  const wrap = el('div', { class: 'screen' });
  const panel = el('div', { class: 'panel' });
  panel.appendChild(el('h2', {}, `${cfg.name} — Timer`));
  panel.appendChild(el('p', { class: 'panel-sub' }, 'Choose a per-question time limit, or run without one.'));

  const options = [
    { label: 'No Timer', value: 0 },
    { label: '15 seconds', value: 15 },
    { label: '30 seconds', value: 30 },
    { label: '60 seconds', value: 60 },
  ];
  let chosen = 0;
  const row = el('div', { class: 'choice-row', role: 'group', 'aria-label': 'Timer options' });
  options.forEach(opt => {
    const btn = el('button', {
      class: 'pill-btn' + (opt.value === chosen ? ' active' : ''),
      onclick: () => {
        chosen = opt.value;
        row.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      },
    }, opt.label);
    row.appendChild(btn);
  });
  panel.appendChild(row);

  panel.appendChild(el('div', { class: 'btn-row' }, [
    el('button', { class: 'primary-btn', onclick: () => startQuiz(mode, chosen) }, `Start ${cfg.name}`),
    el('button', { class: 'ghost-btn', onclick: () => goto('home') }, 'Back'),
  ]));

  wrap.appendChild(panel);
  return wrap;
}

/* ---- Quiz ---- */

function diffClass(d) {
  return 'diff-' + d.toLowerCase();
}

function renderQuiz() {
  const q = state.questions[state.index];
  const wrap = el('div', { class: 'screen' });

  const totalLabel = state.mode === 'practice' ? '∞' : String(state.questions.length);
  const qNumLabel = `${state.index + 1} / ${totalLabel}`;

  wrap.appendChild(el('div', { class: 'quiz-topbar' }, [
    el('button', { class: 'end-btn', onclick: confirmEndQuiz, type: 'button' }, ['✕ ', 'End Quiz']),
  ]));

  const telemetry = el('div', { class: 'telemetry' }, [
    telCell('Question', qNumLabel),
    telCell('Score', String(state.score), 'accent'),
    telCell('Streak', String(state.streak), 'accent'),
    telCell('Difficulty', q.difficulty, diffClass(q.difficulty)),
    telCell('Timer', state.timerSetting ? `${state.timeLeft}s` : '—', state.timerSetting && state.timeLeft <= 5 ? 'amber' : ''),
  ]);
  wrap.appendChild(telemetry);

  if (state.mode !== 'practice') {
    const pct = Math.round(((state.index) / state.questions.length) * 100);
    const track = el('div', { class: 'progress-track' });
    track.appendChild(el('div', { class: 'progress-fill', style: `width:${pct}%` }));
    wrap.appendChild(track);
  }

  const card = el('div', { class: 'q-card' });
  card.appendChild(el('div', { class: 'q-meta' }, [
    el('span', { class: 'q-tag' }, q.category),
    el('span', { class: 'q-tag ' + diffClass(q.difficulty) }, q.difficulty),
  ]));
  card.appendChild(el('p', { class: 'q-text' }, q.question));

  const letters = ['A', 'B', 'C', 'D'];
  const choicesWrap = el('div', { class: 'choices', role: 'radiogroup', 'aria-label': 'Answer choices' });
  q.choices.forEach((choice, i) => {
    const isCorrect = choice === q.answer;
    const isPicked = choice === state.selected;
    let cls = 'choice-btn';
    if (state.answered) {
      if (isCorrect) cls += ' correct';
      else if (isPicked) cls += ' incorrect';
    } else if (isPicked) {
      cls += ' selected';
    }
    const btn = el('button', {
      class: cls,
      disabled: state.answered ? 'disabled' : null,
      'aria-pressed': isPicked ? 'true' : 'false',
      onclick: () => submitAnswer(choice, false),
    }, [
      el('span', { class: 'letter' }, letters[i] || '•'),
      el('span', {}, choice),
    ]);
    choicesWrap.appendChild(btn);
  });
  card.appendChild(choicesWrap);

  if (state.answered) {
    const wasCorrect = state.selected === q.answer;
    const fb = el('div', { class: 'feedback ' + (wasCorrect ? 'ok' : 'no'), role: 'status', 'aria-live': 'polite' });
    fb.appendChild(el('div', { class: 'status-line' },
      wasCorrect ? `✓ CORRECT — +${state.lastGain} pts` : `✗ INCORRECT — Correct answer: ${q.answer}`));
    fb.appendChild(el('div', { class: 'explain' }, q.explanation));
    card.appendChild(fb);

    const footer = el('div', { class: 'q-footer' });
    const isLastNonPractice = state.mode !== 'practice' && state.index >= state.questions.length - 1;
    const challengeOver = state.mode === 'challenge' && state.mistakes >= MAX_CHALLENGE_MISTAKES;
    let label = 'Next Question →';
    if (challengeOver) label = 'See Results →';
    else if (isLastNonPractice) label = 'Finish Quiz →';
    footer.appendChild(el('button', { class: 'primary-btn', onclick: advance }, label));
    card.appendChild(footer);
  }

  wrap.appendChild(card);

  if (state.mode === 'challenge') {
    const remaining = MAX_CHALLENGE_MISTAKES - state.mistakes;
    wrap.appendChild(el('p', { class: 'panel-sub', style: 'margin-top:14px;font-family:var(--font-mono);font-size:12px;' },
      `Mistakes remaining before shutdown: ${remaining} / ${MAX_CHALLENGE_MISTAKES}`));
  }

  return wrap;
}

function telCell(label, value, extraClass = '') {
  return el('div', { class: 'cell' }, [
    el('div', { class: 'k' }, label),
    el('div', { class: 'v ' + extraClass }, value),
  ]);
}

// Lightweight update of just the timer readout to avoid full re-render churn each second
function renderTimerOnly() {
  if (state.screen !== 'quiz') return;
  const cells = root.querySelectorAll('.telemetry .cell .v');
  if (cells.length >= 5) {
    cells[4].textContent = state.timerSetting ? `${state.timeLeft}s` : '—';
    cells[4].className = 'v' + (state.timerSetting && state.timeLeft <= 5 ? ' amber' : '');
  }
}

/* ---- Results ---- */

function renderResults() {
  const wrap = el('div', { class: 'screen' });
  const answered = state.correctCount + state.incorrectCount;
  const pct = answered > 0 ? Math.round((state.correctCount / answered) * 100) : 0;
  const rating = ratingFor(pct);
  const seconds = Math.max(0, Math.round(((state.endTime || Date.now()) - state.startTime) / 1000));
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  const timeStr = `${mins}m ${secs}s`;

  wrap.appendChild(el('div', { class: 'rating-banner' }, [
    el('div', { class: 'pct' }, `${pct}%`),
    el('div', { class: 'label' }, `${rating} · ${MODES[state.mode].name}`),
  ]));

  wrap.appendChild(el('div', { class: 'stat-grid' }, [
    statCell('Final Score', String(state.score)),
    statCell('Correct', String(state.correctCount)),
    statCell('Incorrect', String(state.incorrectCount)),
    statCell('Accuracy', `${pct}%`),
    statCell('Highest Streak', String(state.highestStreak)),
    statCell('Time Taken', timeStr),
  ]));

  const btnRow = el('div', { class: 'btn-row' });
  btnRow.appendChild(el('button', { class: 'primary-btn', onclick: () => startQuiz(state.mode, state.timerSetting) }, 'Play Again'));
  btnRow.appendChild(el('button', { class: 'ghost-btn', onclick: () => goto('home') }, 'Try Another Mode'));
  if (state.incorrectLog.length > 0) {
    btnRow.appendChild(el('button', { class: 'ghost-btn', onclick: () => goto('review') }, 'Review Incorrect Answers'));
  }
  btnRow.appendChild(el('button', { class: 'ghost-btn', onclick: () => goto('home') }, 'Back to Home'));
  wrap.appendChild(btnRow);

  return wrap;
}

function statCell(label, value) {
  return el('div', { class: 'stat-cell' }, [
    el('div', { class: 'k' }, label),
    el('div', { class: 'v' }, value),
  ]);
}

/* ---- Review ---- */

function renderReview() {
  const wrap = el('div', { class: 'screen' });
  wrap.appendChild(el('div', { class: 'section-label' }, `Incorrect answers (${state.incorrectLog.length})`));

  if (state.incorrectLog.length === 0) {
    wrap.appendChild(el('div', { class: 'empty-note' }, 'No incorrect answers to review — clean run.'));
  } else {
    state.incorrectLog.forEach(item => {
      const box = el('div', { class: 'review-item' });
      box.appendChild(el('p', { class: 'q' }, item.question));
      box.appendChild(el('div', { class: 'row wrong' }, [
        el('span', { class: 'lbl' }, 'Your answer:'),
        el('span', { class: 'val' }, item.userAnswer),
      ]));
      box.appendChild(el('div', { class: 'row right' }, [
        el('span', { class: 'lbl' }, 'Correct answer:'),
        el('span', { class: 'val' }, item.correctAnswer),
      ]));
      box.appendChild(el('div', { class: 'explain' }, item.explanation));
      wrap.appendChild(box);
    });
  }

  wrap.appendChild(el('div', { class: 'btn-row' }, [
    el('button', { class: 'ghost-btn', onclick: () => goto('results') }, '← Back to Results'),
    el('button', { class: 'primary-btn', onclick: () => goto('home') }, 'Back to Home'),
  ]));

  return wrap;
}

/* ---------- Boot ---------- */

render();

</script>
