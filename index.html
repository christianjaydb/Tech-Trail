<style>
/* ===== Tokens — light gray tech palette, blue / amber complements ===== */
:root{
  --bg:#eef0f3;
  --bg-soft:#e6e9ed;
  --panel:rgba(255,255,255,0.72);
  --panel-alt:rgba(255,255,255,0.96);
  --border:#d5dae1;
  --border-bright:#b7c0cc;
  --text:#1b212b;
  --text-dim:#5b6576;
  --text-faint:#8992a3;
  --accent:#4f5b6b;       /* signal gray */
  --accent-hi:#242b36;
  --accent-dim:rgba(79,91,107,0.10);
  --gold:#6b7480;         /* muted steel — secondary accent */
  --gold-dim:rgba(107,116,128,0.12);
  --danger:#d94336;
  --danger-dim:rgba(217,67,54,0.10);
  --ok:#1f9d5c;            /* easy / correct-adjacent green */
  --ok-dim:rgba(31,157,92,0.10);
  --info:#2f7fe0;         /* cool signal blue — matches danger/ok's saturation, not the neutral grays */
  --info-dim:rgba(47,127,224,0.12);
  --amber:#b8791f;        /* warm complement, distinct from the gray "gold" token above */
  --amber-dim:rgba(184,121,31,0.12);
  --violet:#7c5cd6;
  --violet-dim:rgba(124,92,214,0.12);
  --on-accent:#f7f8fa;    /* light text set on dark accent fills */
  --radius:10px;
  --radius-sm:7px;
  --font-display:'Poppins','Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --font-body:'Poppins',system-ui,-apple-system,sans-serif;
}

*{box-sizing:border-box;}
html,body{height:100%;}
html{
  background:
    radial-gradient(ellipse 1000px 560px at 10% -8%, rgba(0,0,0,0.035) 0%, transparent 58%),
    radial-gradient(ellipse 800px 560px at 96% 104%, rgba(0,0,0,0.03) 0%, transparent 58%),
    url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxNDAnIGhlaWdodD0nMTQwJz4KICA8ZyBmaWxsPSdub25lJyBzdHJva2U9JyMwYTBkMTInIHN0cm9rZS13aWR0aD0nMSc+CiAgICA8cGF0aCBkPSdNMCAyNCBINDYgVjcwIEgxNDAnIHN0cm9rZS1vcGFjaXR5PScwLjA1Jy8+CiAgICA8cGF0aCBkPSdNNzAgMCBWMzQgSDE0MCcgc3Ryb2tlLW9wYWNpdHk9JzAuMDUnLz4KICAgIDxwYXRoIGQ9J00wIDk2IEgzMCBWMTQwJyBzdHJva2Utb3BhY2l0eT0nMC4wNScvPgogICAgPHBhdGggZD0nTTEwMCAxNDAgVjExMCBINjAgVjg2JyBzdHJva2Utb3BhY2l0eT0nMC4wNScvPgogICAgPHBhdGggZD0nTTAgNjAgSDE0JyBzdHJva2Utb3BhY2l0eT0nMC4wNScvPgogIDwvZz4KICA8ZyBmaWxsPScjMGEwZDEyJz4KICAgIDxjaXJjbGUgY3g9JzQ2JyBjeT0nMjQnIHI9JzEuNicgZmlsbC1vcGFjaXR5PScwLjA3Jy8+CiAgICA8Y2lyY2xlIGN4PSc0NicgY3k9JzcwJyByPScxLjYnIGZpbGwtb3BhY2l0eT0nMC4wNycvPgogICAgPGNpcmNsZSBjeD0nNzAnIGN5PSczNCcgcj0nMS42JyBmaWxsLW9wYWNpdHk9JzAuMDcnLz4KICAgIDxjaXJjbGUgY3g9JzMwJyBjeT0nOTYnIHI9JzEuNicgZmlsbC1vcGFjaXR5PScwLjA3Jy8+CiAgICA8Y2lyY2xlIGN4PSc2MCcgY3k9Jzg2JyByPScxLjYnIGZpbGwtb3BhY2l0eT0nMC4wNycvPgogICAgPGNpcmNsZSBjeD0nMTAwJyBjeT0nMTEwJyByPScxLjYnIGZpbGwtb3BhY2l0eT0nMC4wNycvPgogIDwvZz4KPC9zdmc+Cg=="),
    var(--bg);
  background-size:auto, auto, 140px 140px, auto;
  background-position:0 0, 0 0, 0 0, 0 0;
  background-attachment:fixed;
  scrollbar-color:var(--border-bright) var(--bg);
  scrollbar-width:thin;
}
::-webkit-scrollbar{width:11px;height:11px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{
  background:var(--border-bright);
  border-radius:8px;
  border:2px solid var(--bg);
}
::-webkit-scrollbar-thumb:hover{background:var(--accent-dim);}
body{
  margin:0;
  background:transparent;
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

#app{
  max-width:900px;
  margin:0 auto;
  padding:28px 20px 60px;
  position:relative;
}

button{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}

.primary-btn:active:not(:disabled),
.ghost-btn:active,
.pill-btn:active,
.choice-btn:active:not(:disabled),
.end-btn:active,
.mode-card:active{
  transform:scale(.97);
}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:0.001s!important;transition-duration:0.001s!important;}
}

/* ===== Brand bar ===== */
.brand-bar{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;
  padding:4px 2px 22px;
  border-bottom:1px solid var(--border-bright);
  margin-bottom:30px;
  position:relative;
}
.brand{
  display:flex;align-items:center;gap:12px;
}
.brand-mark{
  width:42px;height:42px;
  border-radius:9px;
  background:var(--panel-alt);
  border:1px solid var(--border-bright);
  color:var(--accent-hi);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow:0 4px 14px -6px rgba(30,38,50,0.18), 0 0 16px -8px rgba(79,91,107,0.22);
}
.brand-mark svg{display:block;width:23px;height:23px;}
.brand-word{
  font-family:var(--font-display);
  font-weight:700;
  font-size:20px;
  letter-spacing:.01em;
  color:var(--text);
  line-height:1;
}
.brand-word em{
  font-style:normal;
  color:var(--accent-hi);
}
.brand-tag{
  font-family:var(--font-mono);
  font-size:11.5px;
  color:var(--accent-hi);
  letter-spacing:.03em;
  opacity:.9;
  display:inline-flex;align-items:center;
}
.brand-tag::after{
  content:'';
  display:inline-block;
  width:6px;height:12px;
  margin-left:6px;
  background:var(--accent-hi);
  animation:cursorBlink 1.1s step-end infinite;
}
@keyframes cursorBlink{0%,49%{opacity:1;}50%,100%{opacity:0;}}

/* ===== Screens ===== */
.screen{animation:fadein .35s ease-out;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ===== Home ===== */
.hero{padding:8px 2px 34px;}
.hero h1{
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(26px,5vw,38px);
  line-height:1.25;
  margin:0 0 14px;
  color:var(--text);
  letter-spacing:0;
}
.hero h1 span{
  color:var(--accent-hi);
  font-style:normal;
}
.hero p{
  color:var(--text-dim);
  font-size:15.5px;
  line-height:1.7;
  max-width:58ch;
  margin:0 0 20px;
}
.hero-stats{
  display:flex;gap:24px;flex-wrap:wrap;
  font-family:var(--font-body);
  font-size:13px;
  color:var(--text-dim);
}
.hero-stats b{color:var(--accent-hi);font-weight:700;}

.section-label{
  font-family:var(--font-body);
  font-size:12.5px;
  letter-spacing:.04em;
  color:var(--accent-hi);
  font-weight:700;
  margin:0 0 16px;
  padding-left:2px;
  display:flex;align-items:center;gap:9px;
}
.section-label::after{
  content:'';
  flex:1;
  height:1px;
  background:linear-gradient(90deg, var(--border-bright), transparent);
}

.mode-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:16px;
  margin-bottom:34px;
}
.mode-card{
  background:var(--panel);
  backdrop-filter:blur(8px);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px 20px 18px;
  text-align:left;
  cursor:pointer;
  color:var(--text);
  transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease, background .18s ease;
  display:flex;flex-direction:column;gap:8px;
  position:relative;
  overflow:hidden;
}
.mode-card:hover,.mode-card:focus-visible{
  border-color:var(--accent);
  background:var(--panel-alt);
  transform:translateY(-2px);
  box-shadow:0 12px 26px -18px rgba(20,26,34,0.22), 0 0 0 1px rgba(79,91,107,0.15), 0 0 24px -6px rgba(79,91,107,0.18);
}
.mode-card .mode-name{
  font-family:var(--font-display);
  font-size:17px;
  font-weight:700;
  letter-spacing:0;
}
.mode-card .mode-meta{
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--accent-hi);
  font-weight:600;
  letter-spacing:.03em;
}
.mode-card .mode-desc{
  font-size:13.5px;
  color:var(--text-dim);
  line-height:1.55;
  margin:0;
}
.mode-card{padding-right:60px;}
.mode-icon{
  position:absolute;
  top:16px;right:16px;
  width:34px;height:34px;
  border-radius:8px;
  background:var(--panel-alt);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent);
  flex-shrink:0;
  transition:border-color .18s ease, color .18s ease, background .18s ease, transform .18s ease;
}
.mode-icon svg{display:block;width:17px;height:17px;}
.mode-card:hover .mode-icon,.mode-card:focus-visible .mode-icon{
  border-color:var(--accent);
  color:var(--accent-hi);
  background:var(--accent-dim);
  transform:translateY(-1px);
}
/* Per-route tint — gives each icon a distinct signal color at rest,
   so the five routes read apart from each other, not just from their labels.
   All five sit at the same saturation/opacity so none reads louder than the rest. */
.mode-icon-quick{color:var(--info);border-color:rgba(91,157,240,0.32);background:var(--info-dim);}
.mode-icon-standard{color:var(--amber);border-color:rgba(224,168,77,0.32);background:var(--amber-dim);}
.mode-icon-challenge{color:var(--danger);border-color:rgba(255,107,94,0.32);background:var(--danger-dim);}
.mode-icon-practice{color:var(--ok);border-color:rgba(72,217,138,0.32);background:var(--ok-dim);}
.mode-icon-full{color:var(--violet);border-color:rgba(166,138,245,0.32);background:var(--violet-dim);}
.mode-card:hover .mode-icon-quick,.mode-card:focus-visible .mode-icon-quick{
  border-color:var(--info);color:#fff;background:rgba(91,157,240,0.26);
}
.mode-card:hover .mode-icon-standard,.mode-card:focus-visible .mode-icon-standard{
  border-color:var(--amber);color:#fff;background:rgba(224,168,77,0.26);
}
.mode-card:hover .mode-icon-challenge,.mode-card:focus-visible .mode-icon-challenge{
  border-color:var(--danger);color:#fff;background:rgba(255,107,94,0.26);
}
.mode-card:hover .mode-icon-practice,.mode-card:focus-visible .mode-icon-practice{
  border-color:var(--ok);color:#fff;background:rgba(72,217,138,0.26);
}
.mode-card:hover .mode-icon-full,.mode-card:focus-visible .mode-icon-full{
  border-color:var(--violet);color:#fff;background:rgba(166,138,245,0.26);
}

/* ===== Panel / config ===== */
.panel{
  background:var(--panel);
  backdrop-filter:blur(8px);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:26px;
  box-shadow:0 16px 34px -28px rgba(0,0,0,0.5);
}
.panel h2{
  font-family:var(--font-display);
  font-weight:700;
  font-size:20px;
  margin:0 0 6px;
  letter-spacing:0;
}
.panel .panel-sub{color:var(--text-dim);font-size:13.5px;margin:0 0 20px;}

.choice-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
.pill-btn{
  background:var(--panel-alt);
  border:1px solid var(--border);
  color:var(--text);
  padding:11px 18px;
  border-radius:var(--radius-sm);
  font-family:var(--font-mono);
  font-size:12.5px;
  cursor:pointer;
  transition:border-color .15s ease, background .15s ease, color .15s ease, box-shadow .15s ease;
  min-height:40px;
}
.pill-btn:hover{border-color:var(--border-bright);}
.pill-btn.active{
  background:var(--accent-dim);
  border-color:var(--accent);
  color:var(--accent-hi);
  font-weight:700;
}

.primary-btn{
  background:var(--accent);
  color:var(--on-accent);
  border:none;
  padding:13px 24px;
  border-radius:var(--radius-sm);
  font-family:var(--font-mono);
  font-weight:700;
  font-size:13.5px;
  letter-spacing:.02em;
  cursor:pointer;
  transition:filter .15s ease, transform .15s ease, box-shadow .15s ease;
  box-shadow:0 8px 20px -8px rgba(79,91,107,0.4), 0 0 0 1px rgba(79,91,107,0.3) inset;
  min-height:46px;
}
.primary-btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 10px 26px -6px rgba(79,91,107,0.5), 0 0 0 1px rgba(79,91,107,0.35) inset;}
.primary-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}

.ghost-btn{
  background:transparent;
  color:var(--text-dim);
  border:1px solid var(--border);
  padding:12px 20px;
  border-radius:var(--radius-sm);
  font-family:var(--font-mono);
  font-size:13px;
  letter-spacing:.01em;
  cursor:pointer;
  transition:border-color .15s ease,color .15s ease,background .15s ease;
  min-height:46px;
}
.ghost-btn:hover{border-color:var(--accent);color:var(--accent-hi);background:var(--accent-dim);}

.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;}

/* ===== Modal (custom confirm — avoids blocked native dialogs) ===== */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(4,6,9,0.65);
  backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  z-index:100;
  animation:fadein .15s ease both;
}
.modal-box{
  background:var(--panel-alt);
  border:1px solid var(--border-bright);
  border-radius:var(--radius);
  padding:24px;
  max-width:380px;
  width:100%;
  box-shadow:0 24px 48px -20px rgba(0,0,0,0.7);
}
.modal-title{
  font-family:var(--font-display);
  font-weight:700;
  font-size:18px;
  margin:0 0 10px;
  color:var(--text);
}
.modal-body{
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.6;
  color:var(--text-dim);
  margin:0 0 20px;
}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
.modal-actions .ghost-btn,.modal-actions .primary-btn{min-height:42px;padding:10px 18px;}
.primary-btn.danger{
  background:var(--danger);
  color:#1a0806;
  box-shadow:0 8px 20px -8px rgba(255,107,94,0.5), 0 0 0 1px rgba(255,107,94,0.3) inset;
}
.primary-btn.danger:hover{filter:brightness(1.06);}

/* ===== Quiz topbar / End Quiz control ===== */
.quiz-stickybar{
  position:sticky;
  top:0;
  z-index:20;
  background:transparent;
  backdrop-filter:blur(14px) saturate(120%);
  -webkit-backdrop-filter:blur(14px) saturate(120%);
  padding-top:10px;
  margin:0 -2px 18px;
  padding-left:2px;
  padding-right:2px;
}
.quiz-topbar{
  display:flex;
  justify-content:flex-end;
  margin-bottom:10px;
}
.end-btn{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text-faint);
  padding:8px 14px;
  border-radius:999px;
  font-family:var(--font-mono);
  font-size:12px;
  font-weight:600;
  letter-spacing:.02em;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  transition:border-color .15s ease,color .15s ease,background .15s ease,transform .1s ease;
  min-height:34px;
}
.end-btn:hover,.end-btn:focus-visible{
  border-color:var(--danger);
  color:var(--danger);
  background:var(--danger-dim);
}

/* ===== Telemetry bar (now a calm stat strip) ===== */
.telemetry{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-bottom:0;
  font-family:var(--font-body);
}
.telemetry .cell{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:11px 13px;
  min-width:0;
  position:relative;
  overflow:hidden;
}
.telemetry .cell .k{
  font-size:10.5px;
  letter-spacing:.03em;
  color:var(--text-faint);
  margin-bottom:4px;
}
.telemetry .cell .v{
  font-size:15px;
  font-weight:600;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-family:var(--font-mono);
  letter-spacing:-0.01em;
}
.telemetry .cell .v.accent{color:var(--accent-hi);}
.telemetry .cell .v.amber{color:var(--gold);}
.telemetry .cell .v.diff-easy{color:var(--ok);}
.telemetry .cell .v.diff-medium{color:var(--info);}
.telemetry .cell .v.diff-hard{color:var(--danger);}

.timer-cell .timer-bar{
  position:absolute;left:0;right:0;bottom:0;
  height:3px;
  background:var(--border);
}
.timer-cell .timer-bar-fill{
  height:100%;
  background:var(--accent);
  transition:width 1s linear, background-color .3s ease;
}
.timer-cell.low .timer-bar-fill{background:var(--gold);}

@keyframes cellPulse{
  0%{box-shadow:0 0 0 0 rgba(79,91,107,0.3);}
  100%{box-shadow:0 0 0 8px rgba(79,91,107,0);}
}
.telemetry .cell.pulse{animation:cellPulse .5s ease-out;}

@keyframes popFloat{
  0%{opacity:0;transform:translate(-50%,4px) scale(.9);}
  20%{opacity:1;transform:translate(-50%,-2px) scale(1);}
  100%{opacity:0;transform:translate(-50%,-22px) scale(1);}
}
.score-pop{
  position:absolute;
  left:50%;top:-2px;
  transform:translate(-50%,0);
  font-family:var(--font-mono);
  font-weight:700;
  font-size:12px;
  color:var(--accent-hi);
  animation:popFloat 0.9s ease-out both;
  pointer-events:none;
  white-space:nowrap;
}

.progress-track{
  height:8px;
  background:var(--border);
  border-radius:8px;
  overflow:hidden;
  margin-top:14px;
  margin-bottom:0;
}
.progress-fill{
  height:100%;
  background:var(--accent);
  border-radius:8px;
  transition:width .3s ease;
}

/* ===== Question card ===== */
.q-card{
  background:var(--panel);
  backdrop-filter:blur(8px);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:26px 24px;
  box-shadow:0 16px 34px -28px rgba(0,0,0,0.5);
}
.q-meta{
  display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  margin-bottom:16px;
  font-family:var(--font-body);
  font-size:11.5px;
  letter-spacing:.02em;
}
.q-tag{
  padding:4px 10px;
  border-radius:999px;
  border:1px solid var(--border-bright);
  color:var(--text-dim);
  font-weight:600;
}
.q-tag.diff-easy{color:var(--ok);border-color:rgba(72,217,138,0.3);background:var(--ok-dim);}
.q-tag.diff-medium{color:var(--info);border-color:rgba(91,157,240,0.3);background:var(--info-dim);}
.q-tag.diff-hard{color:var(--danger);border-color:rgba(255,107,94,0.3);background:var(--danger-dim);}

.q-text{
  font-family:var(--font-body);
  font-weight:600;
  font-size:18.5px;
  line-height:1.55;
  margin:0 0 22px;
  color:var(--text);
}

.choices{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;}
.choice-btn{
  text-align:left;
  background:var(--panel-alt);
  border:1px solid var(--border);
  color:var(--text);
  padding:14px 16px;
  border-radius:var(--radius-sm);
  font-size:14.5px;
  cursor:pointer;
  display:flex;align-items:center;gap:12px;
  transition:border-color .12s ease, background .12s ease, box-shadow .12s ease, transform .12s ease;
  min-height:48px;
}
.choice-btn:hover:not(:disabled){border-color:var(--accent);background:var(--accent-dim);transform:translateY(-1px);}
.choice-btn:disabled{cursor:default;}
.choice-btn .letter{
  font-family:var(--font-body);
  font-weight:700;
  font-size:12px;
  color:var(--text-faint);
  border:1px solid var(--border);
  border-radius:8px;
  width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.choice-btn.selected{border-color:var(--accent);background:var(--accent-dim);}
.choice-btn.correct{
  border-color:var(--accent);
  background:var(--accent-dim);
}
.choice-btn.correct .letter{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.choice-btn.incorrect{
  border-color:var(--danger);
  background:var(--danger-dim);
}
.choice-btn.incorrect .letter{background:var(--danger);color:var(--on-accent);border-color:var(--danger);}
.choice-btn.dim{opacity:.45;}

.feedback{
  margin-top:18px;
  padding:15px 17px;
  border-radius:var(--radius-sm);
  font-family:var(--font-body);
  font-size:13.5px;
  line-height:1.6;
  border:1px solid var(--border);
}
.feedback.ok{border-color:rgba(72,217,138,0.3);background:var(--ok-dim);}
.feedback.no{border-color:rgba(255,107,94,0.3);background:var(--danger-dim);}
.feedback .status-line{
  font-weight:700;
  letter-spacing:0;
  margin-bottom:6px;
}
.feedback.ok .status-line{color:var(--ok);}
.feedback.no .status-line{color:var(--danger);}
.feedback .explain{color:var(--text-dim);font-family:var(--font-body);font-size:13.5px;}

.q-footer{display:flex;justify-content:flex-end;margin-top:20px;}

.mistake-note{
  margin-top:14px;
  font-family:var(--font-body);
  font-size:12px;
  color:var(--text-faint);
}

.kbd-hint{
  margin-top:16px;
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.01em;
  color:var(--text-faint);
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
.kbd-hint kbd{
  background:var(--panel-alt);
  border:1px solid var(--border-bright);
  border-radius:5px;
  padding:2px 6px;
  font-family:var(--font-mono);
  font-size:10.5px;
  color:var(--text-dim);
}

/* ===== Results ===== */
.rating-banner{
  text-align:center;
  padding:34px 20px;
  border-radius:var(--radius);
  border:1px solid var(--border);
  background:var(--panel);
  backdrop-filter:blur(8px);
  margin-bottom:22px;
  position:relative;
  overflow:hidden;
}
.rating-banner::before{
  content:'';
  position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%, rgba(79,91,107,0.10), transparent 65%);
  pointer-events:none;
}
.rating-banner .pct{
  font-family:var(--font-mono);
  font-size:52px;
  font-weight:700;
  color:var(--accent-hi);
  line-height:1;
  position:relative;
  text-shadow:0 0 28px rgba(127,225,255,0.35);
}
.rating-banner .label{
  font-family:var(--font-mono);
  font-size:13px;
  letter-spacing:.03em;
  color:var(--text-dim);
  margin-top:12px;
  position:relative;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
  margin-bottom:26px;
}
.stat-cell{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;}
.stat-cell .k{font-family:var(--font-body);font-size:11px;letter-spacing:.02em;color:var(--text-faint);margin-bottom:6px;}
.stat-cell .v{font-family:var(--font-mono);font-size:19px;font-weight:600;color:var(--accent-hi);}

/* ===== Review ===== */
.review-item{
  background:var(--panel);
  backdrop-filter:blur(8px);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px 20px;
  margin-bottom:12px;
}
.review-item .q{font-family:var(--font-body);font-size:15.5px;font-weight:600;margin:0 0 10px;}
.review-item .row{font-family:var(--font-body);font-size:13px;margin:4px 0;}
.review-item .row .lbl{color:var(--text-faint);margin-right:6px;}
.review-item .row.wrong .val{color:var(--danger);}
.review-item .row.right .val{color:var(--accent-hi);}
.review-item .explain{color:var(--text-dim);font-size:13.5px;margin-top:10px;line-height:1.5;}

.empty-note{
  color:var(--text-dim);
  font-family:var(--font-body);
  font-size:13.5px;
  padding:22px;
  text-align:center;
  border:1px dashed var(--border-bright);
  border-radius:var(--radius);
}

/* ===== Responsive ===== */
@media(max-width:640px){
  #app{padding:20px 16px 48px;}
  .telemetry{grid-template-columns:repeat(2,1fr);}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .rating-banner .pct{font-size:42px;}
  .rating-banner{padding:28px 16px;}
  .q-card,.panel{padding:20px 18px;}
  .q-text{font-size:16.5px;}
  .btn-row{flex-direction:column;}
  .btn-row .primary-btn,.btn-row .ghost-btn{width:100%;}
  .q-footer{
    position:sticky;
    bottom:0;
    margin:20px -16px 0;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(var(--bg-soft), var(--bg-soft) 60%, var(--bg-soft));
    border-top:1px solid var(--border);
    box-shadow:0 -12px 20px -12px rgba(0,0,0,0.4);
  }
  .q-footer .primary-btn{width:100%;}
  .modal-actions{flex-direction:column-reverse;}
  .modal-actions .ghost-btn,.modal-actions .primary-btn{width:100%;}
}

@media(max-width:420px){
  .brand-word{font-size:17px;}
  .hero h1{font-size:23px;}
  .mode-card{padding:16px;padding-right:54px;}
  .mode-icon{top:14px;right:14px;width:30px;height:30px;}
  .mode-icon svg{width:15px;height:15px;}
  .choice-row .pill-btn{flex:1 1 calc(50% - 10px);text-align:center;}
}

<script>
/* ============================================================
   Computer Systems Basics Challenge — quiz engine
   QUESTION_POOL is provided by questions_data.js (loaded first)
   ============================================================ */

const root = document.getElementById('app');

/* ---------- Randomization helpers ---------- */

// Fisher-Yates shuffle — returns a NEW array, never mutates input
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Returns a shuffled copy of a question with its choices shuffled too
function shuffleChoices(question) {
  return Object.assign({}, question, { choices: shuffle(question.choices) });
}

// Picks `count` unique questions from the pool and shuffles their choices.
// Never mutates QUESTION_POOL.
function shuffleQuestions(pool, count) {
  const picked = shuffle(pool).slice(0, count);
  return picked.map(shuffleChoices);
}

/* ---------- Mode configuration ---------- */

const MODES = {
  quick:     { name: 'Quick Quiz',    count: 10,  desc: '10 questions. Fast diagnostic pass with immediate feedback.', code: 'QK-10' },
  standard:  { name: 'Standard Quiz', count: 25,  desc: '25 questions across all topics, with a live progress readout.', code: 'STD-25' },
  challenge: { name: 'Challenge Mode',count: 50,  desc: '50 questions, ramping from easy to hard. 5 mistakes and it\'s over.', code: 'CHL-50' },
  practice:  { name: 'Practice Mode', count: null,desc: 'Unlimited, untimed practice with an explanation after every answer.', code: 'PRC-∞' },
  full:      { name: 'Full Review',   count: QUESTION_POOL.length, desc: `The entire ${QUESTION_POOL.length}-question pool, shuffled, no repeats.`, code: `FUL-${QUESTION_POOL.length}` },
};

// Icons echo the brand-mark's circuit language (currentColor stroke, 1.6 weight,
// round caps) so each route reads as a distinct signal rather than a decoration.
const MODE_ICONS = {
  // Quick Quiz — a lightning bolt, for a fast diagnostic pass
  quick: `

  // Standard Quiz — a filled progress bar, for the live progress readout
  standard: `

  <rect x="7.3" y="14.8" width="12" height="2.4" rx="1.2" fill="currentColor"/>
</svg>`,
  // Challenge Mode — ramping bars with a lit node at the peak, for rising difficulty
  challenge: `
<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <line x1="8" y1="23" x2="8" y2="18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="16" y1="23" x2="16" y2="13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="24" y1="23" x2="24" y2="8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="24" cy="8" r="1.9" fill="currentColor"/>
</svg>`,
  // Practice Mode — a bold infinity loop, for untimed and unlimited repetition
  practice: `
<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <path d="M16 16 C16 12 12.8 9.2 9.8 9.2 C6.3 9.2 4 12.1 4 16 C4 19.9 6.3 22.8 9.8 22.8 C13.8 22.8 15.3 19 16 16 C16.7 13 18.2 9.2 22.2 9.2 C25.7 9.2 28 12.1 28 16 C28 19.9 25.7 22.8 22.2 22.8 C19.2 22.8 16 20 16 16 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
</svg>`,

  full: `

  <path d="M16 7 L25 12 L16 17 L7 12 Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M7 17.5 L16 22.5 L25 17.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M7 22.5 L16 27.5 L25 22.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`,
};

const MAX_CHALLENGE_MISTAKES = 5;

function ratingFor(pct) {
  if (pct >= 90) return 'Excellent';
  if (pct >= 80) return 'Very Good';
  if (pct >= 70) return 'Good';
  if (pct >= 60) return 'Needs Improvement';
  return 'Keep Practicing';
}

/* ---------- Application state ---------- */

let state = null;

function freshState() {
  return {
    screen: 'home',
    mode: null,
    timerSetting: 0, // 0 = no timer
    questions: [],
    index: 0,
    score: 0,
    streak: 0,
    highestStreak: 0,
    correctCount: 0,
    incorrectCount: 0,
    incorrectLog: [],
    selected: null,
    answered: false,
    timeLeft: 0,
    timerId: null,
    startTime: null,
    endTime: null,
    mistakes: 0,
    practicePool: [],   // shuffled queue for practice mode
    pendingMode: null,  // mode chosen but awaiting timer selection
  };
}

state = freshState();

function stopTimer() {
  if (state.timerId) {
    clearInterval(state.timerId);
    state.timerId = null;
  }
}

function goto(screen) {
  state.screen = screen;
  render();
}

/* ---------- Quiz session setup ---------- */

function buildSession(mode) {
  if (mode === 'challenge') {
    const easy = shuffle(QUESTION_POOL.filter(q => q.difficulty === 'Easy'));
    const medium = shuffle(QUESTION_POOL.filter(q => q.difficulty === 'Medium'));
    const hard = shuffle(QUESTION_POOL.filter(q => q.difficulty === 'Hard'));
    const eCount = Math.min(15, easy.length);
    const mCount = Math.min(20, medium.length);
    const hCount = Math.min(15, hard.length);
    const seq = [...easy.slice(0, eCount), ...medium.slice(0, mCount), ...hard.slice(0, hCount)];
    return seq.map(shuffleChoices);
  }
  if (mode === 'full') {
    return shuffleQuestions(QUESTION_POOL, QUESTION_POOL.length);
  }
  const cfg = MODES[mode];
  return shuffleQuestions(QUESTION_POOL, cfg.count);
}

function startQuiz(mode, timerSetting) {
  stopTimer();
  const fresh = freshState();
  fresh.mode = mode;
  fresh.timerSetting = mode === 'practice' ? 0 : timerSetting;
  fresh.startTime = Date.now();

  if (mode === 'practice') {
    fresh.practicePool = shuffle(QUESTION_POOL);
    fresh.questions = [fresh.practicePool.shift()].map(shuffleChoices);
  } else {
    fresh.questions = buildSession(mode);
  }
  state = fresh;
  goto('quiz');
  armTimer();
}

function nextPracticeQuestion() {
  if (state.practicePool.length === 0) {
    state.practicePool = shuffle(QUESTION_POOL);
  }
  const q = shuffleChoices(state.practicePool.shift());
  state.questions.push(q);
}

/* ---------- Timer ---------- */

function armTimer() {
  stopTimer();
  if (!state.timerSetting) return;
  state.timeLeft = state.timerSetting;
  state.timerId = setInterval(() => {
    state.timeLeft -= 1;
    if (state.timeLeft <= 0) {
      stopTimer();
      if (!state.answered) submitAnswer(null, true);
    } else {
      renderTimerOnly();
    }
  }, 1000);
}

/* ---------- Answering ---------- */

function submitAnswer(choice, timedOut) {
  if (state.answered) return;
  const q = state.questions[state.index];
  stopTimer();
  state.answered = true;
  state.selected = choice;
  const correct = !timedOut && choice === q.answer;

  if (correct) {
    state.correctCount += 1;
    state.streak += 1;
    state.highestStreak = Math.max(state.highestStreak, state.streak);
  } else {
    state.incorrectCount += 1;
    state.streak = 0;
    state.mistakes += 1;
    state.incorrectLog.push({
      question: q.question,
      userAnswer: timedOut ? '(no answer — time expired)' : choice,
      correctAnswer: q.answer,
      explanation: q.explanation,
    });
  }
  // Score is always the percentage of correct answers out of everything
  // answered so far, capped between 0 and 100 — never a raw point tally.
  const answeredSoFar = state.correctCount + state.incorrectCount;
  state.score = answeredSoFar > 0
    ? Math.max(0, Math.min(100, Math.round((state.correctCount / answeredSoFar) * 100)))
    : 0;
  render();
}

function advance() {
  const isLast = state.index >= state.questions.length - 1;

  if (state.mode === 'challenge' && state.mistakes >= MAX_CHALLENGE_MISTAKES) {
    finishQuiz();
    return;
  }
  if (state.mode === 'practice') {
    state.index += 1;
    nextPracticeQuestion();
    state.answered = false;
    state.selected = null;
    render();
    armTimer();
    return;
  }
  if (isLast) {
    finishQuiz();
    return;
  }
  state.index += 1;
  state.answered = false;
  state.selected = null;
  render();
  armTimer();
}

// Lets the player end the run early from mid-quiz. Whatever has been
// answered so far still counts — results are computed from the same
// score/correctCount/incorrectCount tallies as a normal finish.
// Uses a custom modal instead of window.confirm(), since native browser
// dialogs are blocked in sandboxed/embedded previews and would otherwise
// make the button appear to do nothing.
function confirmEndQuiz() {
  const answered = state.correctCount + state.incorrectCount;
  const msg = answered > 0
    ? `You've answered ${answered} question${answered === 1 ? '' : 's'} so far. Your results will be based on those.`
    : 'No questions have been answered yet — your results will be empty.';
  showModal({
    title: 'End quiz now?',
    body: msg,
    confirmLabel: 'End Quiz',
    cancelLabel: 'Keep Playing',
    onConfirm: finishQuiz,
  });
}

function showModal({ title, body, confirmLabel, cancelLabel, onConfirm }) {
  const overlay = el('div', { class: 'modal-overlay', role: 'presentation' });
  const onKeydown = (e) => { if (e.key === 'Escape') { e.preventDefault(); close(); } };
  const close = () => {
    overlay.remove();
    document.removeEventListener('keydown', onKeydown);
  };
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  document.addEventListener('keydown', onKeydown);

  const box = el('div', { class: 'modal-box', role: 'alertdialog', 'aria-modal': 'true', 'aria-label': title }, [
    el('h3', { class: 'modal-title' }, title),
    el('p', { class: 'modal-body' }, body),
    el('div', { class: 'modal-actions' }, [
      el('button', { class: 'ghost-btn', onclick: close }, cancelLabel),
      el('button', {
        class: 'primary-btn danger',
        onclick: () => { close(); onConfirm(); },
      }, confirmLabel),
    ]),
  ]);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  box.querySelector('.primary-btn')?.focus();
}

function finishQuiz() {
  stopTimer();
  state.endTime = Date.now();
  goto('results');
}

/* ---------- Rendering ---------- */

function render() {
  root.innerHTML = '';
  root.appendChild(renderBrandBar());

  let body;
  switch (state.screen) {
    case 'home': body = renderHome(); break;
    case 'timer-select': body = renderTimerSelect(); break;
    case 'quiz': body = renderQuiz(); break;
    case 'results': body = renderResults(); break;
    case 'review': body = renderReview(); break;
    default: body = renderHome();
  }
  root.appendChild(body);
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue; // skip falsy attrs (e.g. disabled: null)
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (v === true) node.setAttribute(k, '');
    else node.setAttribute(k, v);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}

const TRAIL_MARK_SVG = `

  <rect x="13" y="13" width="6" height="6" rx="1" fill="currentColor"/>
  <line x1="13" y1="9" x2="13" y2="6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="19" y1="9" x2="19" y2="6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="13" y1="23" x2="13" y2="26" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="19" y1="23" x2="19" y2="26" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="9" y1="13" x2="6" y2="13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="9" y1="19" x2="6" y2="19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>

function renderBrandBar() {
  return el('div', { class: 'brand-bar' }, [

/* ---- Home ---- */

function renderHome() {
  const wrap = el('div', { class: 'screen' });
  wrap.appendChild(el('div', { class: 'hero' }, [
    el('h1', {}, ['Chart your route through ', el('span', {}, 'computer systems')]),
    el('p', {}, `A self-guided trail through hardware, operating systems, networking, and cybersecurity fundamentals. Every attempt reshuffles a fresh path from a pool of ${QUESTION_POOL.length} questions — no two runs look the same.`),
    el('div', { class: 'hero-stats' }, [
      el('span', {}, [el('b', {}, String(QUESTION_POOL.length)), ' questions']),
      el('span', {}, [el('b', {}, '5'), ' routes']),

  wrap.appendChild(el('div', { class: 'section-label' }, 'Choose your route'));

  const grid = el('div', { class: 'mode-grid' });

      },

}

/* ---- Timer select ---- */

function renderTimerSelect() {
  const mode = state.pendingMode;
  const cfg = MODES[mode];
  const wrap = el('div', { class: 'screen' });
  const panel = el('div', { class: 'panel' });
  panel.appendChild(el('h2', {}, `${cfg.name} — Timer`));
  panel.appendChild(el('p', { class: 'panel-sub' }, 'Choose a per-question time limit, or run without one.'));

  const options = [
    { label: 'No Timer', value: 0 },
    { label: '15 seconds', value: 15 },
    { label: '30 seconds', value: 30 },
    { label: '60 seconds', value: 60 },
  ];
  let chosen = 0;
  const row = el('div', { class: 'choice-row', role: 'group', 'aria-label': 'Timer options' });
  options.forEach(opt => {
    const btn = el('button', {
      class: 'pill-btn' + (opt.value === chosen ? ' active' : ''),
      onclick: () => {
        chosen = opt.value;
        row.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      },
    }, opt.label);
    row.appendChild(btn);
  });
  panel.appendChild(row);

  panel.appendChild(el('div', { class: 'btn-row' }, [
    el('button', { class: 'primary-btn', onclick: () => startQuiz(mode, chosen) }, `Start ${cfg.name}`),
    el('button', { class: 'ghost-btn', onclick: () => goto('home') }, 'Back'),
  ]));

  wrap.appendChild(panel);
  return wrap;
}

/* ---- Quiz ---- */

function diffClass(d) {
  return 'diff-' + d.toLowerCase();
}

function renderQuiz() {
  const q = state.questions[state.index];
  const wrap = el('div', { class: 'screen' });

  const totalLabel = state.mode === 'practice' ? '∞' : String(state.questions.length);
  const qNumLabel = `${state.index + 1} / ${totalLabel}`;

  const stickyBar = el('div', { class: 'quiz-stickybar' });
  stickyBar.appendChild(el('div', { class: 'quiz-topbar' }, [
    el('button', { class: 'end-btn', onclick: confirmEndQuiz, type: 'button' }, ['✕ ', 'End Quiz']),
  ]));

  const scoreCell = telCell('Score', `${state.score}%`, 'accent');
  if (state.answered && state.selected === q.answer) {
    scoreCell.classList.add('pulse');
  }
  const streakCell = telCell('Streak', String(state.streak), 'accent');
  if (state.answered && state.streak > 0 && state.selected === q.answer) {
    streakCell.classList.add('pulse');
  }

  const timerLow = state.timerSetting && state.timeLeft <= 5;
  const timerCell = telCell('Timer', state.timerSetting ? `${state.timeLeft}s` : '—', timerLow ? 'amber' : '');
  timerCell.classList.add('timer-cell');
  if (timerLow) timerCell.classList.add('low');
  if (state.timerSetting) {
    const pct = Math.max(0, Math.min(100, (state.timeLeft / state.timerSetting) * 100));
    const bar = el('div', { class: 'timer-bar' });
    bar.appendChild(el('div', { class: 'timer-bar-fill', style: `width:${pct}%` }));
    timerCell.appendChild(bar);
  }

  const telemetry = el('div', { class: 'telemetry' }, [
    telCell('Question', qNumLabel),
    scoreCell,
    streakCell,
    telCell('Difficulty', q.difficulty, diffClass(q.difficulty)),
    timerCell,
  ]);
  stickyBar.appendChild(telemetry);

  if (state.mode !== 'practice') {
    const pct = Math.round(((state.index) / state.questions.length) * 100);
    const track = el('div', { class: 'progress-track' });
    track.appendChild(el('div', { class: 'progress-fill', style: `width:${pct}%` }));
    stickyBar.appendChild(track);
  }
  wrap.appendChild(stickyBar);

  const card = el('div', { class: 'q-card' });
  card.appendChild(el('div', { class: 'q-meta' }, [
    el('span', { class: 'q-tag' }, q.category),
    el('span', { class: 'q-tag ' + diffClass(q.difficulty) }, q.difficulty),
  ]));
  card.appendChild(el('p', { class: 'q-text' }, q.question));

  const letters = ['A', 'B', 'C', 'D'];
  const choicesWrap = el('div', { class: 'choices', role: 'radiogroup', 'aria-label': 'Answer choices' });
  q.choices.forEach((choice, i) => {
    const isCorrect = choice === q.answer;
    const isPicked = choice === state.selected;
    let cls = 'choice-btn';
    let badge = letters[i] || '•';
    if (state.answered) {
      if (isCorrect) { cls += ' correct'; badge = '✓'; }
      else if (isPicked) { cls += ' incorrect'; badge = '✗'; }
      else { cls += ' dim'; }
    } else if (isPicked) {
      cls += ' selected';
    }
    const btn = el('button', {
      class: cls,
      disabled: state.answered ? 'disabled' : null,
      'aria-pressed': isPicked ? 'true' : 'false',
      onclick: () => submitAnswer(choice, false),
    }, [
      el('span', { class: 'letter' }, badge),
      el('span', {}, choice),
    ]);
    choicesWrap.appendChild(btn);
  });
  card.appendChild(choicesWrap);

  if (!state.answered) {
    card.appendChild(el('div', { class: 'kbd-hint' }, [
      el('kbd', {}, '1–4'), 'or', el('kbd', {}, 'A–D'), 'to answer · ',
      el('kbd', {}, 'Esc'), 'to end quiz',
    ]));
  }

  if (state.answered) {
    const wasCorrect = state.selected === q.answer;
    const fb = el('div', { class: 'feedback ' + (wasCorrect ? 'ok' : 'no'), role: 'status', 'aria-live': 'polite' });
    fb.appendChild(el('div', { class: 'status-line' },
      wasCorrect ? '✓ CORRECT' : `✗ INCORRECT — Correct answer: ${q.answer}`));
    fb.appendChild(el('div', { class: 'explain' }, q.explanation));
    card.appendChild(fb);

    const footer = el('div', { class: 'q-footer' });
    const isLastNonPractice = state.mode !== 'practice' && state.index >= state.questions.length - 1;
    const challengeOver = state.mode === 'challenge' && state.mistakes >= MAX_CHALLENGE_MISTAKES;
    let label = 'Next Question →';
    if (challengeOver) label = 'See Results →';
    else if (isLastNonPractice) label = 'Finish Quiz →';
    footer.appendChild(el('button', { class: 'primary-btn', onclick: advance }, label));
    card.appendChild(footer);
    card.appendChild(el('div', { class: 'kbd-hint' }, [el('kbd', {}, 'Enter'), 'to continue']));
  }

  wrap.appendChild(card);

  if (state.mode === 'challenge') {
    const remaining = MAX_CHALLENGE_MISTAKES - state.mistakes;
    wrap.appendChild(el('p', { class: 'panel-sub', style: 'margin-top:14px;font-family:var(--font-mono);font-size:12px;' },
      `Mistakes remaining before shutdown: ${remaining} / ${MAX_CHALLENGE_MISTAKES}`));
  }

  return wrap;
}

function telCell(label, value, extraClass = '') {
  return el('div', { class: 'cell' }, [
    el('div', { class: 'k' }, label),
    el('div', { class: 'v ' + extraClass }, value),
  ]);
}

// Lightweight update of just the timer readout to avoid full re-render churn each second
function renderTimerOnly() {
  if (state.screen !== 'quiz') return;
  const cells = root.querySelectorAll('.telemetry .cell .v');
  const timerCell = root.querySelector('.telemetry .cell.timer-cell');
  const low = state.timerSetting && state.timeLeft <= 5;
  if (cells.length >= 5) {
    cells[4].textContent = state.timerSetting ? `${state.timeLeft}s` : '—';
    cells[4].className = 'v' + (low ? ' amber' : '');
  }
  if (timerCell) {
    timerCell.classList.toggle('low', !!low);
    const fill = timerCell.querySelector('.timer-bar-fill');
    if (fill && state.timerSetting) {
      const pct = Math.max(0, Math.min(100, (state.timeLeft / state.timerSetting) * 100));
      fill.style.width = pct + '%';
    }
  }
}

/* ---- Results ---- */

function renderResults() {
  const wrap = el('div', { class: 'screen' });
  const answered = state.correctCount + state.incorrectCount;
  const pct = answered > 0 ? Math.round((state.correctCount / answered) * 100) : 0;
  const rating = ratingFor(pct);
  const seconds = Math.max(0, Math.round(((state.endTime || Date.now()) - state.startTime) / 1000));
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  const timeStr = `${mins}m ${secs}s`;

  const pctEl = el('div', { class: 'pct' }, '0%');
  wrap.appendChild(el('div', { class: 'rating-banner' }, [
    pctEl,
    el('div', { class: 'label' }, `${rating} · ${MODES[state.mode].name}`),
  ]));
  animateCountUp(pctEl, pct, '%');

  wrap.appendChild(el('div', { class: 'stat-grid' }, [
    statCell('Final Score', `${pct}%`),
    statCell('Correct', String(state.correctCount)),
    statCell('Incorrect', String(state.incorrectCount)),
    statCell('Accuracy', `${pct}%`),
    statCell('Highest Streak', String(state.highestStreak)),
    statCell('Time Taken', timeStr),
  ]));

  const btnRow = el('div', { class: 'btn-row' });
  btnRow.appendChild(el('button', { class: 'primary-btn', onclick: () => startQuiz(state.mode, state.timerSetting) }, 'Play Again'));
  btnRow.appendChild(el('button', { class: 'ghost-btn', onclick: () => goto('home') }, 'Try Another Mode'));
  if (state.incorrectLog.length > 0) {
    btnRow.appendChild(el('button', { class: 'ghost-btn', onclick: () => goto('review') }, 'Review Incorrect Answers'));
  }
  btnRow.appendChild(el('button', { class: 'ghost-btn', onclick: () => goto('home') }, 'Back to Home'));
  wrap.appendChild(btnRow);

  return wrap;
}

// Animates a number counting up to `target` over ~700ms. Respects the
// reduced-motion setting by jumping straight to the final value.
function animateCountUp(node, target, suffix = '') {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    node.textContent = `${target}${suffix}`;
    return;
  }
  const duration = 700;
  const start = performance.now();
  function tick(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    node.textContent = `${Math.round(target * eased)}${suffix}`;
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function statCell(label, value) {
  return el('div', { class: 'stat-cell' }, [
    el('div', { class: 'k' }, label),
    el('div', { class: 'v' }, value),
  ]);
}

/* ---- Review ---- */

function renderReview() {
  const wrap = el('div', { class: 'screen' });
  wrap.appendChild(el('div', { class: 'section-label' }, `Incorrect answers (${state.incorrectLog.length})`));

  if (state.incorrectLog.length === 0) {
    wrap.appendChild(el('div', { class: 'empty-note' }, 'No incorrect answers to review — clean run.'));
  } else {
    state.incorrectLog.forEach(item => {
      const box = el('div', { class: 'review-item' });
      box.appendChild(el('p', { class: 'q' }, item.question));
      box.appendChild(el('div', { class: 'row wrong' }, [
        el('span', { class: 'lbl' }, 'Your answer:'),
        el('span', { class: 'val' }, item.userAnswer),
      ]));
      box.appendChild(el('div', { class: 'row right' }, [
        el('span', { class: 'lbl' }, 'Correct answer:'),
        el('span', { class: 'val' }, item.correctAnswer),
      ]));
      box.appendChild(el('div', { class: 'explain' }, item.explanation));
      wrap.appendChild(box);
    });
  }

  wrap.appendChild(el('div', { class: 'btn-row' }, [
    el('button', { class: 'ghost-btn', onclick: () => goto('results') }, '← Back to Results'),
    el('button', { class: 'primary-btn', onclick: () => goto('home') }, 'Back to Home'),
  ]));

  return wrap;
}

/* ---------- Keyboard shortcuts ---------- */
// 1-4 / A-D pick an answer, Enter advances once answered, Escape opens
// the End Quiz confirmation. Disabled while the modal owns focus/keys.
function handleQuizKeydown(e) {
  if (document.querySelector('.modal-overlay')) return;
  if (state.screen !== 'quiz') return;
  const q = state.questions[state.index];

  if (!state.answered) {
    const numMap = { '1': 0, '2': 1, '3': 2, '4': 3 };
    const letMap = { a: 0, b: 1, c: 2, d: 3 };
    let idx = null;
    if (Object.prototype.hasOwnProperty.call(numMap, e.key)) idx = numMap[e.key];
    else if (Object.prototype.hasOwnProperty.call(letMap, e.key.toLowerCase())) idx = letMap[e.key.toLowerCase()];
    if (idx !== null && q.choices[idx] !== undefined) {
      e.preventDefault();
      submitAnswer(q.choices[idx], false);
      return;
    }
  } else if (e.key === 'Enter') {
    e.preventDefault();
    advance();
    return;
  }

  if (e.key === 'Escape') {
    e.preventDefault();
    confirmEndQuiz();
  }
}
document.addEventListener('keydown', handleQuizKeydown);

/* ---------- Boot ---------- */

render();

</script>
</body>
</html>
